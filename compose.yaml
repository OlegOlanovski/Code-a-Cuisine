services:
  n8n:
    image: n8nio/n8n:2.44.4
    container_name: code-a-cuisine-n8n
    expose:
      - '5678'
    environment:
      GENERIC_TIMEZONE: Europe/Berlin
      TZ: Europe/Berlin
      N8N_PROXY_HOPS: '1'
      N8N_CONCURRENCY_PRODUCTION_LIMIT: '1'
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
      N8N_LOG_LEVEL: ${N8N_LOG_LEVEL:-info}
      N8N_LOG_OUTPUT: ${N8N_LOG_OUTPUT:-console,file}
      N8N_LOG_FILE_LOCATION: /home/node/.n8n/logs/n8n.log
      N8N_LOG_FILE_SIZE_MAX: ${N8N_LOG_FILE_SIZE_MAX:-10}
      N8N_LOG_FILE_COUNT_MAX: ${N8N_LOG_FILE_COUNT_MAX:-5}
      CODE_ENABLE_STDOUT: 'true'
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/code-a-cuisine.json:/workflows/code-a-cuisine.json:ro
    restart: unless-stopped

  quota-gateway:
    image: nginx:1.29-alpine
    container_name: code-a-cuisine-quota-gateway
    depends_on:
      - n8n
    ports:
      - '5679:80'
    volumes:
      - ./n8n/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  n8n_data:
