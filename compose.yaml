services:
  n8n:
    image: n8nio/n8n:2.44.4
    container_name: code-a-cuisine-n8n
    ports:
      - '5679:5678'
    environment:
      GENERIC_TIMEZONE: Europe/Berlin
      TZ: Europe/Berlin
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  n8n_data:
